name: Haberleri güncelle

on:
  schedule:
    - cron: "*/20 * * * *"   # her 20 dakikada bir (GitHub yoğun saatlerde geciktirebilir)
  workflow_dispatch: {}       # elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: |
          python3 -I scraper/test_scrape.py
          python3 -I scraper/test_ilan_tara.py
      - name: İlanları tara ve doğrula
        run: python3 scraper/ilan_tara.py --en-fazla 40
      - name: Arama motoru sayfalarını üret
        run: python3 seo_uret.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "bot@users.noreply.github.com"
          git add data/ilanlar.json il ilan zabita-alimi itfaiye-eri-alimi isci-alimi memur-alimi belediye-personel-alimi sozlesmeli-personel-alimi akademik-personel-alimi saglik-personeli-alimi guvenlik-gorevlisi-alimi son-gun-ilanlar sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Veriyi güncelle"
          git pull --rebase -X theirs origin main || true
          git push
      - name: Yeni ilanları arama motorlarına bildir (IndexNow)
        if: always()
        run: python3 indexnow.py 150 || true
