name: Haberleri güncelle

on:
  # Otomatik zamanlama kapalı: haber başlığı derleyen bu tarama doğrulanmamış kayıt ekliyordu.
  # Açmak için aşağıdaki iki satırı etkinleştir:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}       # elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Haberleri tara
        run: python3 scraper/scrape.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "bot@users.noreply.github.com"
          git add data/ilanlar.json
          git diff --cached --quiet || (git commit -m "Veriyi güncelle" && git push)
